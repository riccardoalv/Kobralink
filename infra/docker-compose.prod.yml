name: farolprint

services:
  farolprint:
    image: ghcr.io/riccardoalv/farolprint:latest
    container_name: farolprint
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      FAROLPRINT_DATA_DIR: /data
      FAROLPRINT_PORT: 7100
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:7100}
    ports:
      - "${FAROLPRINT_BIND:-0.0.0.0}:${FAROLPRINT_PORT:-7100}:7100"
      - "${FAROLPRINT_BIND:-0.0.0.0}:7125-7140:7125-7140"
    volumes:
      - farolprint-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:7100/api/auth/ok').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 15s

volumes:
  farolprint-data:
