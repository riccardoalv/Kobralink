name: Tester report
description: You ran Farol Print with your printer. Tell us how it went, good or bad.
labels: [tester-report]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Farol Print! [Testing Farol Print](https://github.com/riccardoalv/farolprint/blob/main/docs/testing.md) lists what to look at.
        Blunt is good: what is wrong, confusing, missing or not worth having.
  - type: input
    id: version
    attributes:
      label: Farol Print version or image
      placeholder: ghcr.io/riccardoalv/farolprint:0.4.0
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Printer model and firmware, ACE or external spool, slicer, Spoolman, Home Assistant, how you run Farol Print.
      placeholder: Kobra 4 (firmware 1.2.1.3, no ACE), OrcaSlicer 2.4, Spoolman, Docker on a homelab server
    validations:
      required: true
  - type: dropdown
    id: time
    attributes:
      label: How long did you run it?
      options: [Less than an hour, A day, A few days, A week or more]
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: What worked well
  - type: textarea
    id: wrong
    attributes:
      label: What was wrong
      description: Wrong states, missing usage in Spoolman, camera, notifications, settings... One line each is fine; open separate bug reports for the big ones.
    validations:
      required: true
  - type: textarea
    id: confusing
    attributes:
      label: What was confusing or missing
